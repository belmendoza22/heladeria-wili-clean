{% extends 'base.html' %}
{% block title %}Registrar Compra{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 800px;">
    <h1 class="mb-4">Registrar Compra de Insumos</h1>

    <form method="post" id="formCompra">
        {% csrf_token %}

        <div class="mb-4">
            <label class="form-label">Proveedor</label>
            <select name="proveedor" class="form-select" required>
                <option value="">Seleccioná un proveedor</option>
                {% for proveedor in proveedores %}
                    <option value="{{ proveedor.id }}">
                        {{ proveedor.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <h5 class="mb-3">Insumos comprados</h5>
        <div class="table-responsive">
            <table class="table table-bordered" id="tablaInsumos">
                <thead class="table-light">
                    <tr>
                        <th>Insumo</th>
                        <th>Cantidad</th>
                        <th>Precio unitario (Gs.)</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="filasInsumos">
                    <tr class="fila-insumo">
                        <td>
                            <select name="insumo_id[]" class="form-select form-select-sm" required>
                                <option value="">Seleccioná</option>
                                {% for insumo in insumos %}
                                    <option value="{{ insumo.id }}">
                                        {{ insumo.nombre }} ({{ insumo.unidad_medida.simbolo }})
                                    </option>
                                {% endfor %}
                            </select>
                        </td>
                        <td>
                            <input type="number" name="cantidad[]"
                                   class="form-control form-control-sm cantidad"
                                   min="1" value="1" required>
                        </td>
                        <td>
                            <input type="number" name="precio_unitario[]"
                                   class="form-control form-control-sm precio"
                                   min="0" value="0" required>
                        </td>
                        <td>
                            <span class="subtotal fw-bold">G. 0</span>
                        </td>
                        <td>
                            <button type="button"
                                    class="btn btn-sm btn-danger btn-eliminar-fila">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button type="button" class="btn btn-outline-primary btn-sm mb-4"
                id="btnAgregarFila">
            <i class="bi bi-plus"></i> Agregar insumo
        </button>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <h5>Total: <span id="totalCompra" class="text-success">G. 0</span></h5>
            <div class="d-flex gap-2">
                <a href="{% url 'control_stock' %}" class="btn btn-secondary">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle"></i> Registrar Compra
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
const insumoOptions = `{% for insumo in insumos %}<option value="{{ insumo.id }}">{{ insumo.nombre }} ({{ insumo.unidad_medida.simbolo }})</option>{% endfor %}`;

function calcularTotales() {
    let total = 0;
    document.querySelectorAll('.fila-insumo').forEach(fila => {
        const cantidad = parseInt(fila.querySelector('.cantidad').value) || 0;
        const precio = parseInt(fila.querySelector('.precio').value) || 0;
        const subtotal = cantidad * precio;
        fila.querySelector('.subtotal').textContent = `G. ${subtotal.toLocaleString()}`;
        total += subtotal;
    });
    document.getElementById('totalCompra').textContent = `G. ${total.toLocaleString()}`;
}

document.getElementById('btnAgregarFila').addEventListener('click', function () {
    const tbody = document.getElementById('filasInsumos');
    const nuevaFila = document.createElement('tr');
    nuevaFila.className = 'fila-insumo';
    nuevaFila.innerHTML = `
        <td>
            <select name="insumo_id[]" class="form-select form-select-sm" required>
                <option value="">Seleccioná</option>
                ${insumoOptions}
            </select>
        </td>
        <td><input type="number" name="cantidad[]" class="form-control form-control-sm cantidad" min="1" value="1" required></td>
        <td><input type="number" name="precio_unitario[]" class="form-control form-control-sm precio" min="0" value="0" required></td>
        <td><span class="subtotal fw-bold">G. 0</span></td>
        <td><button type="button" class="btn btn-sm btn-danger btn-eliminar-fila"><i class="bi bi-trash"></i></button></td>
    `;
    tbody.appendChild(nuevaFila);
    agregarEventosFila(nuevaFila);
});

function agregarEventosFila(fila) {
    fila.querySelector('.cantidad').addEventListener('input', calcularTotales);
    fila.querySelector('.precio').addEventListener('input', calcularTotales);
    fila.querySelector('.btn-eliminar-fila').addEventListener('click', function () {
        if (document.querySelectorAll('.fila-insumo').length > 1) {
            fila.remove();
            calcularTotales();
        }
    });
}

document.querySelectorAll('.fila-insumo').forEach(agregarEventosFila);
</script>
{% endblock %}
