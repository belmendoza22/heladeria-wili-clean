{% extends 'base.html' %} {% block title %}Nueva Unidad de Medida{% endblock %}
{% block content %}
<div class="container mt-4" style="max-width: 400px">
  <h1 class="mb-4">Nueva Unidad de Medida</h1>

  <form method="post">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input
        type="text"
        name="nombre"
        class="form-control"
        placeholder="Ej: Kilogramo"
        required
      />
    </div>

    <div class="mb-3">
      <label class="form-label">Símbolo</label>
      <input
        type="text"
        name="simbolo"
        class="form-control"
        placeholder="Ej: kg"
        maxlength="10"
        required
      />
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success">
        <i class="bi bi-check-circle"></i> Crear Unidad
      </button>
      <a href="{% url 'gestion_insumos' %}" class="btn btn-secondary">
        <i class="bi bi-x-circle"></i> Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
