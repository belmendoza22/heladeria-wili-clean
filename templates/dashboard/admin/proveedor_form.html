{% extends 'base.html' %}
{% block title %}{{ accion }} Proveedor{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <h1 class="mb-4">{{ accion }} Proveedor</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control"
                   value="{{ proveedor.nombre|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">RUC</label>
            <input type="text" name="ruc" class="form-control"
                   value="{{ proveedor.ruc|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contacto</label>
            <input type="text" name="contacto" class="form-control"
                   value="{{ proveedor.contacto|default:'' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" name="telefono" class="form-control"
                   value="{{ proveedor.telefono|default:'' }}">
        </div>

        <div class="mb-4">
            <label class="form-label">Dirección</label>
            <input type="text" name="direccion" class="form-control"
                   value="{{ proveedor.direccion|default:'' }}">
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> {{ accion }} Proveedor
            </button>
            <a href="{% url 'gestion_proveedores' %}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
