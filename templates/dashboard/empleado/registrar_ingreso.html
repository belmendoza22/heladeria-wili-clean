{% extends 'base.html' %}
{% block title %}Registrar Ingreso{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width:500px;">
    <h1 class="mb-4">Registrar Ingreso</h1>

    <div class="card mb-3">
        <div class="card-body">
            <p class="mb-0 text-muted">
                <i class="bi bi-lock-fill text-success"></i>
                Caja #{{ caja.id }} abierta —
                Balance actual: <strong>G. {{ caja.monto_inicial }}</strong>
            </p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Tipo de ingreso</label>
            <select name="tipo_ingreso" class="form-select" required>
                {% for valor, nombre in tipos %}
                    <option value="{{ valor }}">{{ nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Monto (Gs.)</label>
            <input type="number" name="monto" class="form-control"
                   placeholder="0" min="1" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Descripción (opcional)</label>
            <textarea name="descripcion" class="form-control"
                      rows="2" placeholder="Descripción del ingreso..."></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success w-100">
                <i class="bi bi-plus-circle"></i> Registrar ingreso
            </button>
            <a href="{% url 'gestion_caja' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
