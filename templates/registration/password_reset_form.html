<!-- Página donde el usuario ingresa su email -->

{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Restablecer contraseña</h2>
    <p>Ingresa tu correo electrónico y te enviaremos instrucciones.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enviar correo</button>
    </form>
</div>
{% endblock %}
