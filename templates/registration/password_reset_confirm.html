<!-- Página que aparece al hacer clic en el enlace del correo, para ingresar nueva contraseña -->

{% extends 'base.html' %}

{% block content %}
<div class="container">
    {% if validlink %}
        <h2>Establecer nueva contraseña</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Cambiar contraseña</button>
        </form>
    {% else %}
        <h2>Enlace inválido</h2>
        <p>El enlace ya ha sido usado o es incorrecto. Solicita uno nuevo.</p>
        <a href="{% url 'password_reset' %}">Solicitar nuevo restablecimiento</a>
    {% endif %}
</div>
{% endblock %}
