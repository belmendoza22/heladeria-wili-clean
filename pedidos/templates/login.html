{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Heladería Wili | Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec, #e3f2fd);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            background: white;
            border-radius: 28px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .logo {
            max-width: 200px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-top: 20px;
        }

        .subtitle {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-control {
            height: 52px;
            border-radius: 14px;
            padding-left: 48px;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .input-group {
            position: relative;
        }

        .btn-login {
            height: 52px;
            border-radius: 14px;
            font-weight: 600;
            background: linear-gradient(to right, #f8a5c2, #a5c9ff);
            border: none;
            color: white;
        }

        .links {
            font-size: 14px;
            margin-top: 25px;
        }

        .links a {
            text-decoration: none;
            color: #6c757d;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-card text-center">

    <!-- LOGO -->
    <img src="{% static 'images/Logo_Wili.png' %}" class="logo mb-3" alt="Heladería Wili">

    <div class="title">Iniciar Sesión</div>
    <p class="subtitle">Accede a tu cuenta para gestionar pedidos y stock</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <!-- Usuario -->
        <div class="mb-3 text-start">
            <label class="form-label">Usuario</label>
            <div class="input-group">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
            </div>
        </div>

        <!-- Contraseña -->
        <div class="mb-3 text-start">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
            </div>
        </div>

        <!-- Recordar sesión -->
        <div class="form-check text-start mb-4">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">
                Recordar mi sesión
            </label>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn btn-login w-100">
            Iniciar Sesión
        </button>
    </form>

    <!-- Links -->
    <div class="links d-flex justify-content-between">
        <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
        <a href="{% url 'registro' %}">Crear una cuenta</a>
    </div>

</div>

</body>
</html>
